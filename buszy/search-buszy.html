    <script>
        let allBusStops = [];
        let serviceNumbers = [];
        let currentFilter = 'all';
        let busStopsCache = null;

        const RECENT_SEARCHES_KEY = 'buszy-recent-searches';
        const MAX_RECENT_SEARCHES = 8;

        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const resultsContainer = document.getElementById('results-container');
        const recentSearchesList = document.getElementById('recent-searches-list');
        const clearRecentSearchesBtn = document.getElementById('clear-recent-searches');

        // Get base path
        function getBasePath() {
            if (window.PWAConfig && window.PWAConfig.basePath) {
                return window.PWAConfig.basePath;
            }
            const pathname = window.location.pathname;
            const parts = pathname.split('/').filter(p => p);
            if (parts.length >= 2 && parts[1] === 'buszy') {
                return '/' + parts[0] + '/';
            }
            return '/';
        }

        // Load all bus stops
        async function loadAllBusStops() {
            try {
                const cached = localStorage.getItem('allBusStops');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    const stops = Array.isArray(parsed) ? parsed : (parsed.value || []);
                    if (Array.isArray(stops) && stops.length > 0) {
                        return stops;
                    }
                }
            } catch (e) {
                console.warn('Failed to read cached bus stops:', e);
            }

            let busStops = [];
            let skip = 0;
            let hasMoreData = true;

            while (hasMoreData) {
                const response = await fetch(`https://bat-lta-9eb7bbf231a2.herokuapp.com/bus-stops?$skip=${skip}`);
                if (!response.ok) throw new Error(`Failed to fetch bus stops: ${response.status}`);
                const data = await response.json();

                if (!data.value || data.value.length === 0) {
                    hasMoreData = false;
                } else {
                    busStops = busStops.concat(data.value);
                    skip += 500;
                }
            }

            if (busStops.length > 0) {
                localStorage.setItem('allBusStops', JSON.stringify(busStops));
            }
            return busStops;
        }

        // Load service numbers
        async function loadServiceNumbers() {
            try {
                const basePath = getBasePath();
                const response = await fetch(basePath + 'buszy/json/bus-service-data.json');
                if (response.ok) {
                    const data = await response.json();
                    return data.map(s => s.n);
                }
            } catch (e) {
                console.warn('Failed to load service numbers:', e);
            }
            return [];
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getRecentSearches() {
            try {
                const saved = localStorage.getItem(RECENT_SEARCHES_KEY);
                const parsed = saved ? JSON.parse(saved) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.warn('Failed to parse recent searches:', error);
                return [];
            }
        }

        function saveRecentSearches(recentSearches) {
            localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(recentSearches));
        }

        function recordRecentSearch(search) {
            const searchValue = typeof search === 'string' ? search : (search && (search.query || search.code));
            const normalized = String(searchValue || '').trim();
            if (!normalized || normalized.length < 2) {
                return;
            }

            const cleaned = normalized.replace(/\s+/g, ' ');
            const recents = getRecentSearches();
            const filtered = recents.filter(item => {
                const itemQuery = typeof item === 'string' ? item : item && (item.query || item.code);
                return String(itemQuery || '').toLowerCase() !== cleaned.toLowerCase();
            });
            const recentEntry = typeof search === 'string'
                ? { query: cleaned }
                : { ...search, query: cleaned, code: search.code || cleaned };
            const updated = [recentEntry, ...filtered].slice(0, MAX_RECENT_SEARCHES);
            saveRecentSearches(updated);
            renderRecentSearches();
        }

        function applyRecentSearch(query) {
            if (!query) return;
            searchInput.value = query;
            performSearch();
            searchInput.focus();
        }

        function renderRecentSearches() {
            const recents = getRecentSearches();

            if (!recents.length) {
                recentSearchesList.innerHTML = '<div class="recent-search-empty">No recent searches yet</div>';
                return;
            }

            const basePath = getBasePath();
            const busIconPath = basePath + 'buszy/assets/bus-icon.png';

            recentSearchesList.innerHTML = recents.map(item => {
                const query = typeof item === 'string' ? item : (item.query || item.code || '');
                const isService = (typeof item !== 'string' && item.type === 'service')
                    || (typeof item !== 'string' && !item.type && /^\d{1,4}[a-zA-Z]?$/.test(String(query)));
                const searchValue = escapeHtml(query);
                const displayValue = query.length > 14 ? query.slice(0, 14) + '…' : query;

                return `
                    <button class="recent-search-item" type="button" data-query="${searchValue}" aria-label="Search for ${searchValue}">
                        <div class="recent-search-main">
                            <span class="recent-search-chip${isService ? ' service-recent-chip' : ''}">
                                ${isService ? '' : `<img src="${busIconPath}" alt="Bus icon">`}
                                <span class="bus-stop-code-text">${escapeHtml(displayValue)}</span>
                            </span>
                        </div>
                    </button>
                `;
            }).join('');

            recentSearchesList.querySelectorAll('.recent-search-item').forEach(button => {
                button.addEventListener('click', () => {
                    applyRecentSearch(button.dataset.query);
                });
            });
        }

        function clearRecentSearches() {
            localStorage.removeItem(RECENT_SEARCHES_KEY);
            renderRecentSearches();
        }

        // Perform search
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();

            // Show/hide clear button
            if (query) {
                searchClear.classList.add('show');
            } else {
                searchClear.classList.remove('show');
            }

            if (!query) {
                resultsContainer.classList.remove('services-results');
                resultsContainer.innerHTML = '';
                renderRecentSearches();
                return;
            }

            let results = [];

            // Search in bus stops
            if (currentFilter === 'all' || currentFilter === 'stops') {
                results = results.concat(allBusStops.filter(stop => {
                    const code = (stop.BusStopCode || '').toLowerCase();
                    const desc = (stop.Description || '').toLowerCase();
                    return code.includes(query) || desc.includes(query);
                }).map(stop => ({
                    type: 'stop',
                    code: stop.BusStopCode,
                    description: stop.Description
                })));
            }

            // Search in services
            if (currentFilter === 'all' || currentFilter === 'services') {
                results = results.concat(serviceNumbers.filter(service => {
                    return service.toLowerCase().includes(query);
                }).map(service => ({
                    type: 'service',
                    code: service,
                    description: `Bus Service ${service}`
                })));
            }

            displayResults(results);
        }

        // Display results
        function displayResults(results) {
            resultsContainer.classList.toggle('services-results', results.length > 0 && results.every(result => result.type === 'service'));

            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">
                            <i class="fa-regular fa-magnifying-glass"></i>
                        </div>
                        <p>No results found</p>
                    </div>
                `;
                return;
            }

            const basePath = getBasePath();
            resultsContainer.innerHTML = results.map(result => {
                const isPinned = isStopBookmarked(result.code);
                const pinBtnClass = getPinButtonClass(isPinned);
                const pinBtnIcon = getPinButtonContent(isPinned);

                if (result.type === 'stop') {
                    const safeDescription = escapeHtml(result.description);
                    const busIconPath = basePath + 'buszy/assets/bus-icon.png';
                    return `
                        <div class="result-item result-stop-item">
                            <div class="result-main-row">
                                <a class="result-link" href="javascript:void(0)" data-type="stop" data-code="${escapeHtml(result.code)}" data-description="${escapeHtml(result.description)}" aria-label="Open stop ${escapeHtml(result.code)}">
                                    <div class="result-info">
                                        <div class="result-code">
                                            <img src="${busIconPath}" alt="Bus icon">
                                            <span class="bus-stop-code-text">${escapeHtml(result.code)}</span>
                                        </div>
                                        <div class="result-description">${safeDescription}</div>
                                    </div>
                                </a>
                                <div class="result-actions">
                                    <button class="result-pin-btn ${pinBtnClass}" type="button" data-pin-code="${escapeHtml(result.code)}" data-pin-description="${escapeHtml(result.description)}" title="${isPinned ? 'Unpin this stop' : 'Pin this stop'}" aria-label="${isPinned ? 'Unpin' : 'Pin'} stop ${escapeHtml(result.code)}">
                                        ${pinBtnIcon}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="result-item service-result-item">
                            <div class="result-main-row">
                                <a class="result-link" href="javascript:void(0)" data-type="service" data-code="${escapeHtml(result.code)}" data-description="${escapeHtml(result.description)}" aria-label="Open service ${escapeHtml(result.code)}">
                                    <div class="result-info">
                                        <div class="result-code">
                                            <span class="bus-stop-code-text">${escapeHtml(result.code)}</span>
                                        </div>
                                    </div>
                                </a>
                                <div class="result-nav-arrow" aria-hidden="true">
                                    <i class="fa-regular fa-chevron-right"></i>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');

            resultsContainer.querySelectorAll('.result-link').forEach(link => {
                link.addEventListener('click', (event) => {
                    event.preventDefault();
                    const type = link.dataset.type;
                    const code = link.dataset.code;
                    if (!code) return;

                    if (type === 'service') {
                        navigateToService(code);
                    } else {
                        navigateToStop(code, link.dataset.description || code);
                    }
                });

                link.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        link.click();
                    }
                });
            });

            resultsContainer.querySelectorAll('.result-pin-btn').forEach(pinButton => {
                pinButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();
                    const code = pinButton.dataset.pinCode;
                    const description = pinButton.dataset.pinDescription || code;
                    togglePin(code, pinButton, description);
                });
            });
        }

        function recordSearchFromNavigation(type, code, description) {
            const normalizedCode = String(code || '').trim();
            if (!normalizedCode) {
                return;
            }

            recordRecentSearch({
                type,
                code: normalizedCode,
                description: description || normalizedCode,
                query: normalizedCode
            });
        }

        // Navigate to bus stop arrivals
        function navigateToStop(code, description = '') {
            recordSearchFromNavigation('stop', code, description || searchInput.value.trim() || code);
            const basePath = getBasePath();
            window.location.href = `${basePath}buszy/art.html?BusStopCode=${encodeURIComponent(code)}`;
        }

        // Navigate to service
        function navigateToService(serviceNo) {
            recordSearchFromNavigation('service', serviceNo, `Bus Service ${serviceNo}`);
            const basePath = getBasePath();
            window.location.href = `${basePath}buszy/bus-service.html?service=${encodeURIComponent(serviceNo)}`;
        }

        function isStopBookmarked(code) {
            try {
                const bookmarks = getBookmarkedStops();
                const normalizedCode = String(code || '').trim();
                return bookmarks.some(item => item && String(item.BusStopCode || '').trim() === normalizedCode);
            } catch (error) {
                return false;
            }
        }

        function getBookmarkedStops() {
            try {
                const saved = JSON.parse(localStorage.getItem('bookmarkedBusStops') || '[]');
                return Array.isArray(saved) ? saved : [];
            } catch (error) {
                return [];
            }
        }

        function getPinButtonClass(isPinned) {
            return isPinned ? 'result-pin-btn result-pinned btn btn-unpin btn-2' : 'result-pin-btn btn btn-toPin btn-2';
        }

        function getPinButtonContent(isPinned) {
            return isPinned
                ? '<i class="fa-regular fa-thumbtack-angle-slash"></i>'
                : '<i class="fa-sharp fa-regular fa-thumbtack-angle"></i>';
                        btn.innerHTML = '<i class="fa-regular fa-thumbtack-angle-slash"></i>';
        }

        function updatePinButton(button, isPinned, code) {
            button.className = getPinButtonClass(isPinned);
            button.title = isPinned ? 'Unpin this stop' : 'Pin this stop';
            button.setAttribute('aria-label', `${isPinned ? 'Unpin' : 'Pin'} stop ${code}`);
            button.innerHTML = getPinButtonContent(isPinned);
        }

        function togglePin(code, btn, description) {
            try {
                const bookmarks = getBookmarkedStops();
                const normalizedCode = String(code || '').trim();
                const existingIndex = bookmarks.findIndex(item => item && String(item.BusStopCode || '').trim() === normalizedCode);

                if (existingIndex >= 0) {
                    bookmarks.splice(existingIndex, 1);
                    localStorage.setItem('bookmarkedBusStops', JSON.stringify(bookmarks));
                    updatePinButton(btn, false, code);
                    return;
                }

                bookmarks.push({
                    BusStopCode: code,
                    Description: description || code
                });

                localStorage.setItem('bookmarkedBusStops', JSON.stringify(bookmarks));
                updatePinButton(btn, true, code);
            } catch (error) {
                console.warn('Failed to toggle bookmark for search result:', error);
            }
        }

        // Event listeners
        searchInput.addEventListener('input', performSearch);

        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('show');
            resultsContainer.innerHTML = '';
            renderRecentSearches();
            searchInput.focus();
        });

        clearRecentSearchesBtn.addEventListener('click', clearRecentSearches);


        const filterButtons = document.querySelectorAll('#search-filters .category-tab');
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                performSearch();
            });
        });

        // Initialize
        async function init() {
            allBusStops = await loadAllBusStops();
            serviceNumbers = await loadServiceNumbers();
            renderRecentSearches();

            // Focus search input and perform search if query in URL
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            if (query) {
                searchInput.value = decodeURIComponent(query);
                performSearch();
            }
            searchInput.focus();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

    <script src="../js/pwa-helper.js"></script>
    <script src="../js/pwa-migration.js"></script>
    <script src="./js/pwa-init.js"></script>
    <script src="./js/ann-indicator.js"></script>
    <script src="./js/alerts-indicator.js"></script>
</body>

</html>
