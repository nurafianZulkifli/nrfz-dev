    <style>
        /* Result Items - Match bus-stop styling */
        .result-item {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            border: 1px solid #ddd;
            border-radius: 25px;
            background-color: #fff;
            padding: 0.96em;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .result-item:active {
            transform: scale(0.985);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08) !important;
        }

        body.dark-mode .result-item {
            background-color: #1c1f2b;
            border: 1px solid #2b2b2b33;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.233), 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        .result-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
        }

        .result-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .result-code {
            font-weight: 600;
            color: #000;
            font-size: 1.05rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #94d40b;
            color: #000;
            padding: 5px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        body.dark-mode .result-code {
            background-color: #7db603;
            color: #000;
        }

        .bus-stop-code-text {
            font-weight: 600;
        }

        .result-description {
            font-size: 0.85rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 0.25rem;
        }

        body.dark-mode .result-description {
            color: #aaa;
        }

        .result-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .result-pin-btn {
            padding: 0.4rem 0.6rem;
            background-color: #94d40b;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            flex-shrink: 0;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
        }

        .result-pin-btn:active {
            transform: scale(0.93);
            transition: transform 0.1s ease;
            opacity: 0.85;
        }

        body.dark-mode .result-pin-btn {
            background-color: #7db603;
        }

        .result-pin-btn.pinned {
            background-color: #7db603;
        }

        .result-nav-arrow {
            padding: 0.4rem 0.6rem;
            color: #94d40b;
            font-weight: 600;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .no-results {
            padding: 3rem 1rem;
            text-align: center;
            color: #999;
        }

        body.dark-mode .no-results {
            color: #666;
        }

        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Override category-tab for filters */
        #search-filters .category-tab {
            padding: 12px 20px;
            border: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.233), 0 4px 12px rgba(0, 0, 0, 0.1);
            background: #fff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-size: 0.95rem;
            font-weight: 500;
            color: #000;
            white-space: nowrap;
            display: flex;
            align-items: center;
            border-radius: 24px;
            flex-shrink: 0;
        }

        #search-filters .category-tab:hover {
            color: #000;
            transform: translateY(-2px);
            background-color: #c7e3fb;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        #search-filters .category-tab:active {
            transform: scale(0.93);
            transition: transform 0.1s ease;
            opacity: 0.85;
        }

        #search-filters .category-tab.active {
            background: linear-gradient(84deg, rgba(81, 167, 190, 1) 0%, rgba(53, 64, 117, 1) 100%);
            color: #fff;
        }

        body.dark-mode #search-filters .category-tab {
            background-color: #393e53;
            color: #ffffff;
        }

        body.dark-mode #search-filters .category-tab:hover {
            color: #fff;
            transform: translateY(-2px);
            background-color: #52718d;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        body.dark-mode #search-filters .category-tab.active {
            color: #fff;
        }

        h2 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* Search clear button visibility */
        .search-clear {
            display: none;
        }

        .search-clear.show {
            display: flex;
        }
    </style>

    <section class="pinned" id="search-results-section">

    <script src="../js/jquery.min.js"></script>
    <script src="../js/popper.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/pw.bundle.js"></script>
    <script src="../js/pwa-config.js"></script>
    <script src="./js/shared-arrivals.js"></script>
    <script src="../js/utils.js"></script>

    <script>
        let allBusStops = [];
        let serviceNumbers = [];
        let currentFilter = 'all';
        let busStopsCache = null;

        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const resultsContainer = document.getElementById('results-container');

        // Get base path
        function getBasePath() {
            if (window.PWAConfig && window.PWAConfig.basePath) {
                return window.PWAConfig.basePath;
            }
            const pathname = window.location.pathname;
            const parts = pathname.split('/').filter(p => p);
            if (parts.length >= 2 && parts[1] === 'buszy') {
                return '/' + parts[0] + '/';
            }
            return '/';
        }

        // Load all bus stops
        async function loadAllBusStops() {
            try {
                const cached = localStorage.getItem('allBusStops');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    const stops = Array.isArray(parsed) ? parsed : (parsed.value || []);
                    if (Array.isArray(stops) && stops.length > 0) {
                        return stops;
                    }
                }
            } catch (e) {
                console.warn('Failed to read cached bus stops:', e);
            }

            let busStops = [];
            let skip = 0;
            let hasMoreData = true;

            while (hasMoreData) {
                const response = await fetch(`https://bat-lta-9eb7bbf231a2.herokuapp.com/bus-stops?$skip=${skip}`);
                if (!response.ok) throw new Error(`Failed to fetch bus stops: ${response.status}`);
                const data = await response.json();

                if (!data.value || data.value.length === 0) {
                    hasMoreData = false;
                } else {
                    busStops = busStops.concat(data.value);
                    skip += 500;
                }
            }

            if (busStops.length > 0) {
                localStorage.setItem('allBusStops', JSON.stringify(busStops));
            }
            return busStops;
        }

        // Load service numbers
        async function loadServiceNumbers() {
            try {
                const basePath = getBasePath();
                const response = await fetch(basePath + 'buszy/json/bus-service-data.json');
                if (response.ok) {
                    const data = await response.json();
                    return data.map(s => s.n);
                }
            } catch (e) {
                console.warn('Failed to load service numbers:', e);
            }
            return [];
        }

        // Perform search
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();

            // Show/hide clear button
            if (query) {
                searchClear.classList.add('show');
            } else {
                searchClear.classList.remove('show');
            }

            if (!query) {
                resultsContainer.innerHTML = '';
                return;
            }

            let results = [];

            // Search in bus stops
            if (currentFilter === 'all' || currentFilter === 'stops') {
                results = results.concat(allBusStops.filter(stop => {
                    const code = (stop.BusStopCode || '').toLowerCase();
                    const desc = (stop.Description || '').toLowerCase();
                    return code.includes(query) || desc.includes(query);
                }).map(stop => ({
                    type: 'stop',
                    code: stop.BusStopCode,
                    description: stop.Description
                })));
            }

            // Search in services
            if (currentFilter === 'all' || currentFilter === 'services') {
                results = results.concat(serviceNumbers.filter(service => {
                    return service.toLowerCase().includes(query);
                }).map(service => ({
                    type: 'service',
                    code: service,
                    description: `Bus Service ${service}`
                })));
            }

            displayResults(results);
        }

        // Display results
        function displayResults(results) {
            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">
                            <i class="fa-regular fa-magnifying-glass"></i>
                        </div>
                        <p>No results found</p>
                    </div>
                `;
                return;
            }

            const basePath = getBasePath();
            resultsContainer.innerHTML = results.map(result => {
                const isPinned = localStorage.getItem(`pin_${result.code}`);
                const pinBtnClass = isPinned ? 'pinned' : '';
                const pinBtnIcon = isPinned ? '<i class="fa-solid fa-thumbtack-angle"></i>' : '<i class="fa-sharp fa-regular fa-thumbtack-angle"></i>';

                if (result.type === 'stop') {
                    return `
                        <div class="result-item" onclick="navigateToStop('${result.code}')">
                            <div class="result-main-row">
                                <div class="result-info">
                                    <div class="result-code">
                                        <i class="fa-kit fa-lta-bus-stop"></i>
                                        <span class="bus-stop-code-text">${result.code}</span>
                                    </div>
                                    <div class="result-description">${result.description}</div>
                                </div>
                                <div class="result-actions">
                                    <button class="result-pin-btn ${pinBtnClass}" onclick="event.stopPropagation(); togglePin('${result.code}', this)" title="Pin this stop">
                                        ${pinBtnIcon}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="result-item" onclick="navigateToService('${result.code}')">
                            <div class="result-main-row">
                                <div class="result-info">
                                    <div class="result-code">
                                        <i class="fa-kit fa-lta-bus"></i>
                                        <span class="bus-stop-code-text">Service ${result.code}</span>
                                    </div>
                                    <div class="result-description">${result.description}</div>
                                </div>
                                <div class="result-nav-arrow">
                                    <i class="fa-regular fa-chevron-right"></i>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        // Navigate to bus stop arrivals
        function navigateToStop(code) {
            const basePath = getBasePath();
            window.location.href = `${basePath}buszy/art.html?BusStopCode=${encodeURIComponent(code)}`;
        }

        // Navigate to service
        function navigateToService(serviceNo) {
            const basePath = getBasePath();
            window.location.href = `${basePath}buszy/bus-service.html?service=${encodeURIComponent(serviceNo)}`;
        }

        // Toggle pin
        function togglePin(code, btn) {
            const isPinned = localStorage.getItem(`pin_${code}`);
            if (isPinned) {
                localStorage.removeItem(`pin_${code}`);
                btn.classList.remove('pinned');
                btn.innerHTML = '<i class="fa-sharp fa-regular fa-thumbtack-angle"></i>';
            } else {
                localStorage.setItem(`pin_${code}`, 'true');
                btn.classList.add('pinned');
                btn.innerHTML = '<i class="fa-solid fa-thumbtack-angle"></i>';
            }
        }

        // Event listeners
        searchInput.addEventListener('input', performSearch);
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('show');
            resultsContainer.innerHTML = '';
            searchInput.focus();
        });

        const filterButtons = document.querySelectorAll('#search-filters .category-tab');
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                performSearch();
            });
        });

        // Initialize
        async function init() {
            allBusStops = await loadAllBusStops();
            serviceNumbers = await loadServiceNumbers();
            
            // Focus search input and perform search if query in URL
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            if (query) {
                searchInput.value = decodeURIComponent(query);
                performSearch();
            }
            searchInput.focus();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
